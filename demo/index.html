<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whitematter — CIFAR-10 Classifier</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            color: #1a1a1a;
            background: #fafafa;
        }
        h1 {
            font-weight: 600;
            font-size: 28px;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 14px;
            line-height: 1.5;
        }
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }
        .drop-zone:hover {
            border-color: #888;
            background: #f9f9f9;
        }
        .drop-zone.active {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .drop-zone p {
            margin: 0;
            color: #666;
            font-size: 15px;
        }
        .drop-zone .icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
            opacity: 0.4;
        }
        .preview-section {
            margin-top: 24px;
            text-align: center;
        }
        .preview {
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
        }
        .preview-caption {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }
        .result {
            margin-top: 24px;
        }
        .result h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
        }
        .label {
            width: 88px;
            text-align: right;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            flex-shrink: 0;
        }
        .bar-track {
            flex: 1;
            background: #f0f0f0;
            border-radius: 6px;
            overflow: hidden;
            height: 26px;
        }
        .bar {
            height: 100%;
            background: #2563eb;
            border-radius: 6px;
            transition: width 0.4s ease;
            display: flex;
            align-items: center;
            padding: 0 8px;
            min-width: fit-content;
        }
        .bar span {
            color: white;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .bar-row:first-child .bar {
            background: #1d4ed8;
        }
        .pct-outside {
            font-size: 12px;
            color: #999;
            margin-left: 4px;
            width: 44px;
            flex-shrink: 0;
        }
        #status {
            color: #999;
            font-size: 13px;
            margin-top: 16px;
        }
        #status.ready { color: #16a34a; }
        #status.error { color: #dc2626; }
        .timing {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        footer {
            margin-top: 48px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #bbb;
        }
        footer a { color: #999; }
    </style>
</head>
<body>
    <h1>whitematter</h1>
    <p class="subtitle">ResNet-18 trained from scratch on CIFAR-10 — running entirely in your browser via ONNX Runtime Web</p>

    <div class="drop-zone" id="dropZone">
        <span class="icon">&#128444;</span>
        <p>Drop an image here or click to upload</p>
        <input type="file" accept="image/*" id="fileInput" style="display:none">
    </div>

    <div id="previewSection" class="preview-section" style="display:none;">
        <canvas id="previewCanvas" class="preview" width="32" height="32"></canvas>
        <p class="preview-caption">32 x 32 input (actual model resolution)</p>
    </div>

    <div id="results" class="result" style="display:none;">
        <h3>Predictions</h3>
        <div id="bars"></div>
        <p id="timing" class="timing"></p>
    </div>

    <p id="status">Loading model...</p>

    <footer>
        No data leaves your browser. Inference runs locally via WebAssembly.
    </footer>

    <script>
    const CLASSES = [
        'airplane', 'automobile', 'bird', 'cat', 'deer',
        'dog', 'frog', 'horse', 'ship', 'truck'
    ];

    // CIFAR-10 normalization (must match training data loader)
    const MEAN = [0.4914, 0.4822, 0.4465];
    const STD  = [0.2470, 0.2435, 0.2616];

    let session = null;

    async function loadModel() {
        const statusEl = document.getElementById('status');
        try {
            session = await ort.InferenceSession.create('./resnet18.onnx', {
                executionProviders: ['wasm']
            });
            statusEl.textContent = 'Model loaded. Upload an image to classify.';
            statusEl.className = 'ready';
        } catch (e) {
            statusEl.textContent = 'Failed to load model: ' + e.message;
            statusEl.className = 'error';
            console.error('Model loading error:', e);
        }
    }

    async function classify(imageData) {
        if (!session) return;

        const statusEl = document.getElementById('status');
        statusEl.textContent = 'Running inference...';
        statusEl.className = '';

        const t0 = performance.now();

        // Convert RGBA uint8 [32*32*4] to NCHW float32 [1, 3, 32, 32]
        // Normalize: (pixel / 255 - mean) / std  (matches cifar10.cpp loader)
        const float32 = new Float32Array(1 * 3 * 32 * 32);
        for (let c = 0; c < 3; c++) {
            for (let h = 0; h < 32; h++) {
                for (let w = 0; w < 32; w++) {
                    const srcIdx = (h * 32 + w) * 4 + c;
                    const dstIdx = c * 32 * 32 + h * 32 + w;
                    const pixel = imageData.data[srcIdx] / 255.0;
                    float32[dstIdx] = (pixel - MEAN[c]) / STD[c];
                }
            }
        }

        const tensor = new ort.Tensor('float32', float32, [1, 3, 32, 32]);
        const results = await session.run({ input: tensor });
        const output = results[Object.keys(results)[0]];

        const t1 = performance.now();

        // Softmax over logits
        const logits = Array.from(output.data);
        const maxLogit = Math.max(...logits);
        const exps = logits.map(x => Math.exp(x - maxLogit));
        const sumExp = exps.reduce((a, b) => a + b, 0);
        const probs = exps.map(x => x / sumExp);

        // Sort by probability descending
        const sorted = CLASSES.map((name, i) => ({ name, prob: probs[i] }))
                              .sort((a, b) => b.prob - a.prob);

        // Render top-5 bars
        const barsDiv = document.getElementById('bars');
        barsDiv.innerHTML = sorted.slice(0, 5).map(({ name, prob }) => {
            const pct = (prob * 100).toFixed(1);
            const barWidth = Math.max(prob * 100, 0.5);
            // Show percentage inside the bar if wide enough, otherwise outside
            const showInside = prob >= 0.08;
            return `
                <div class="bar-row">
                    <span class="label">${name}</span>
                    <div class="bar-track">
                        <div class="bar" style="width:${barWidth}%">
                            ${showInside ? `<span>${pct}%</span>` : ''}
                        </div>
                    </div>
                    ${!showInside ? `<span class="pct-outside">${pct}%</span>` : '<span class="pct-outside"></span>'}
                </div>`;
        }).join('');

        document.getElementById('results').style.display = 'block';
        document.getElementById('timing').textContent =
            `Inference: ${(t1 - t0).toFixed(0)} ms`;

        statusEl.textContent = `Prediction: ${sorted[0].name} (${(sorted[0].prob * 100).toFixed(1)}%)`;
        statusEl.className = 'ready';
    }

    function processImage(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('previewCanvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');

                // Center-crop to square, then resize to 32x32
                const size = Math.min(img.width, img.height);
                const sx = (img.width - size) / 2;
                const sy = (img.height - size) / 2;
                ctx.drawImage(img, sx, sy, size, size, 0, 0, 32, 32);

                document.getElementById('previewSection').style.display = 'block';

                const imageData = ctx.getImageData(0, 0, 32, 32);
                classify(imageData);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // --- Event listeners ---

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) processImage(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('active');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('active');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('active');
        if (e.dataTransfer.files[0]) processImage(e.dataTransfer.files[0]);
    });

    loadModel();
    </script>
</body>
</html>
