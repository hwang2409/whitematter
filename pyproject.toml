[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whitematter"
version = "1.0.0"
description = "Pure-Python deep learning framework built on NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Whitematter Contributors" }]
keywords = ["neural-network", "machine-learning", "autograd", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hwang2409/whitematter"
Repository = "https://github.com/hwang2409/whitematter"

[tool.setuptools.packages.find]
where = ["."]
include = ["whitematter*"]
