name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cpp:
    name: C++ build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build
        run: make

      - name: Test
        run: make test

  platform:
    name: Platform tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('platform/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -r platform/requirements.txt

      - name: Type check (mypy)
        working-directory: platform
        run: |
          pip install mypy types-requests
          mypy --ignore-missing-imports --no-error-summary routes/ services/ || true

      - name: Run tests
        working-directory: platform
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend E2E tests
    needs: [frontend]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          pip install -r platform/requirements.txt

      - name: pip audit
        # CVE-2024-23342 (ecdsa): transitive dep via python-jose, no fix available.
        # TODO: migrate from python-jose to PyJWT to drop ecdsa entirely.
        run: pip-audit --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-4539

      - name: Bandit static analysis
        working-directory: platform
        # Non-blocking: bandit produces too many false positives for a new codebase.
        # Re-evaluate once the codebase stabilizes and findings are triaged.
        run: bandit -r . -ll -ii --exclude ./tests --exit-zero

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (production deps only)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  staging-deploy:
    name: Deploy to staging
    needs: [platform, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:staging
          docker build -t $IMAGE .
          docker push $IMAGE

      # Uncomment and configure for your staging environment:
      # - name: Deploy to staging server
      #   run: |
      #     # Option 1: Docker Compose on a staging server
      #     # ssh staging-server "docker pull $IMAGE && docker compose up -d"
      #     #
      #     # Option 2: Railway deploy
      #     # railway up --environment staging
      #     #
      #     # Option 3: Render deploy
      #     # curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
